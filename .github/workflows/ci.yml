name: Apply Task 1 Verified Patch

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/complete-operational-modules]

permissions:
  contents: write

concurrency:
  group: apply-task1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-operational-modules

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Apply structural changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {pattern[:120]}")
              file.write_text(updated)

          queue_path = "apps/plataforma/lib/offline-queue.ts"
          replace_once(
              queue_path,
              r'''export function createOfflineQueueOwner\(\s*client: SupabaseClient,\s*userId: string,\s*\): OfflineQueueOwner \{\s*return \{\s*userId,\s*projectUrl: normalizeProjectUrl\(client\.supabaseUrl\),\s*\};\s*\}''',
              '''export function createOfflineQueueOwner(\n  projectUrl: string,\n  userId: string,\n): OfflineQueueOwner {\n  return {\n    userId,\n    projectUrl: normalizeProjectUrl(projectUrl),\n  };\n}''',
              re.MULTILINE,
          )
          replace_once(
              queue_path,
              r'''(if \(!isOfflineCapableTable\(operation\.table\)\) \{\s*throw new Error\(`O módulo \$\{operation\.table\} não pode armazenar dados offline\.`\);\s*\}\s*)return withWriteLock''',
              r'''\1const table = operation.table;\n  return withWriteLock''',
              re.MULTILINE,
          )
          replace_once(queue_path, r'''table: operation\.table,''', '''table,''')

          panel_path = "apps/plataforma/app/painel/[[...slug]]/page.tsx"
          replace_once(
              panel_path,
              re.escape('import { supabase } from "../../../lib/supabase";'),
              'import { getSupabaseProjectUrl, supabase } from "../../../lib/supabase";',
          )
          replace_once(
              panel_path,
              re.escape('  const client = useMemo(() => supabase(), []);'),
              '  const client = useMemo(() => supabase(), []);\n  const projectUrl = useMemo(() => getSupabaseProjectUrl(), []);',
          )

          panel = Path(panel_path)
          text = panel.read_text()
          redirect_count = text.count('router.replace("/")')
          if redirect_count != 3:
              raise SystemExit(f"Expected 3 root redirects, found {redirect_count}")
          text = text.replace('router.replace("/")', 'router.replace("/login")')
          text = text.replace('<Link href="/">Voltar para o acesso</Link>', '<Link href="/login">Voltar para o acesso</Link>')
          owner_pattern = r'''  const offlineOwner = useMemo\(\s*\(\) => \(client && user \? createOfflineQueueOwner\(client, user\.id\) : undefined\),\s*\[client, user\],\s*\);'''
          owner_replacement = '''  const offlineOwner = useMemo(\n    () =>\n      client && user && projectUrl\n        ? createOfflineQueueOwner(projectUrl, user.id)\n        : undefined,\n    [client, projectUrl, user],\n  );'''
          text, count = re.subn(owner_pattern, owner_replacement, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit(f"Expected one offline owner block, found {count}")
          panel.write_text(text)
          PY

      - name: Verify exact fix
        run: |
          pnpm --filter @udk/plataforma test -- offline-queue.test.ts
          pnpm --filter @udk/plataforma typecheck
          pnpm --filter @udk/plataforma build

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/plataforma/lib/offline-queue.ts 'apps/plataforma/app/painel/[[...slug]]/page.tsx'
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: use explicit Supabase project URL for offline queue"
          git push origin HEAD:feat/complete-operational-modules
