name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-offline-security:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/complete-operational-modules
          fetch-depth: 0
      - name: Patch asynchronous secure queue consumers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected fragment not found in ${path}: ${before.slice(0, 100)}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          const crud = 'apps/plataforma/components/module-crud.tsx';
          replaceExact(
            crud,
            '      let query = client.from(config.table).select("*").limit(500);',
            '      let query = client.from(config.table).select("*").is("deleted_at", null).limit(500);',
          );
          replaceExact(
            crud,
            '  const syncOffline = useCallback(async () => {\n    setPendingOffline(getOfflineQueue().length);\n    if (typeof navigator !== "undefined" && navigator.onLine) {',
            '  const syncOffline = useCallback(async () => {\n    setPendingOffline((await getOfflineQueue()).length);\n    if (typeof navigator !== "undefined" && navigator.onLine) {',
          );
          replaceExact(
            crud,
            '    const queueHandler = () => setPendingOffline(getOfflineQueue().length);',
            '    const queueHandler = () => {\n      void getOfflineQueue().then((queue) => setPendingOffline(queue.length));\n    };',
          );
          replaceExact(
            crud,
            '          enqueueOfflineOperation(\n            editing\n              ? { table: config.table, action: "update", payload, recordId: editing.id }\n              : { table: config.table, action: "insert", payload },\n          );\n          setPendingOffline(getOfflineQueue().length);',
            '          await enqueueOfflineOperation(\n            editing\n              ? { table: config.table, action: "update", payload, recordId: editing.id }\n              : { table: config.table, action: "insert", payload },\n          );\n          setPendingOffline((await getOfflineQueue()).length);',
          );
          replaceExact(
            crud,
            '    const { error: deleteError } = await client.from(config.table).delete().eq("id", record.id);',
            '    const { error: deleteError } = await client\n      .from(config.table)\n      .update({ deleted_at: new Date().toISOString() })\n      .eq("id", record.id);',
          );
          replaceExact(
            crud,
            '        enqueueOfflineOperation({\n          table: config.table,\n          action: "delete",\n          payload: {},\n          recordId: record.id,\n        });\n        setPendingOffline(getOfflineQueue().length);',
            '        await enqueueOfflineOperation({\n          table: config.table,\n          action: "delete",\n          payload: {},\n          recordId: record.id,\n        });\n        setPendingOffline((await getOfflineQueue()).length);',
          );
          replaceExact(crud, '    setNotice("Registro excluído.");', '    setNotice("Registro arquivado com exclusão lógica.");');
          replaceExact(crud, 'if (!window.confirm(`Excluir ${config.singular}', 'if (!window.confirm(`Arquivar ${config.singular}');
          replaceExact(crud, 'title="Excluir"', 'title="Arquivar"');

          const page = 'apps/plataforma/app/painel/[[...slug]]/page.tsx';
          replaceExact(
            page,
            '    setOnline(navigator.onLine);\n    setOfflineCount(getOfflineQueue().length);',
            '    setOnline(navigator.onLine);\n    void getOfflineQueue().then((queue) => setOfflineCount(queue.length));',
          );
          replaceExact(
            page,
            '    const queueHandler = () => setOfflineCount(getOfflineQueue().length);',
            '    const queueHandler = () => {\n      void getOfflineQueue().then((queue) => setOfflineCount(queue.length));\n    };',
          );
          NODE
      - name: Verify and commit integration
        run: |
          git diff --check
          grep -q 'await enqueueOfflineOperation' apps/plataforma/components/module-crud.tsx
          grep -q 'deleted_at' apps/plataforma/components/module-crud.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/plataforma
          git commit -m "fix: integrate encrypted offline queue and soft deletion"
          git push origin HEAD:feat/complete-operational-modules

  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify workspace
        run: pnpm verify
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build both applications
        run: pnpm build
