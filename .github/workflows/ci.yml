name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-access-integration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/complete-operational-modules
          fetch-depth: 0
      - name: Apply identity and queue integration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected fragment not found in ${path}: ${before.slice(0, 120)}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          const page = 'apps/plataforma/app/painel/[[...slug]]/page.tsx';
          replaceExact(
            page,
            'import { getOfflineQueue } from "../../../lib/offline-queue";',
            'import { createOfflineQueueOwner, getOfflineQueue } from "../../../lib/offline-queue";\nimport { computeAllowedModules, computeWritableModules, type RoleGrant, type RolePermission } from "../../../lib/access-control";',
          );
          replaceExact(
            page,
            '  const [roles, setRoles] = useState<Role[]>([]);\n  const [sidebarOpen, setSidebarOpen] = useState(false);',
            '  const [roles, setRoles] = useState<Role[]>([]);\n  const [roleGrants, setRoleGrants] = useState<RoleGrant[]>([]);\n  const [permissions, setPermissions] = useState<RolePermission[]>([]);\n  const [sidebarOpen, setSidebarOpen] = useState(false);',
          );
          replaceExact(
            page,
            '  useEffect(() => {\n    setOnline(navigator.onLine);\n    void getOfflineQueue().then((queue) => setOfflineCount(queue.length));\n\n    const onlineHandler = () => setOnline(true);\n    const offlineHandler = () => setOnline(false);\n    const queueHandler = () => {\n      void getOfflineQueue().then((queue) => setOfflineCount(queue.length));\n    };\n    window.addEventListener("online", onlineHandler);\n    window.addEventListener("offline", offlineHandler);\n    window.addEventListener("udk:offline-queue", queueHandler);\n\n    return () => {\n      window.removeEventListener("online", onlineHandler);\n      window.removeEventListener("offline", offlineHandler);\n      window.removeEventListener("udk:offline-queue", queueHandler);\n    };\n  }, []);',
            '  useEffect(() => {\n    setOnline(navigator.onLine);\n    const onlineHandler = () => setOnline(true);\n    const offlineHandler = () => setOnline(false);\n    window.addEventListener("online", onlineHandler);\n    window.addEventListener("offline", offlineHandler);\n    return () => {\n      window.removeEventListener("online", onlineHandler);\n      window.removeEventListener("offline", offlineHandler);\n    };\n  }, []);',
          );

          replaceExact(
            page,
            '      const [profileResult, rolesResult] = await Promise.all([\n        activeClient.from("profiles").select("full_name,sport_name").eq("id", authenticatedUser.id).maybeSingle(),\n        activeClient.from("user_roles").select("role").eq("user_id", authenticatedUser.id),\n      ]);',
            '      const [profileResult, rolesResult] = await Promise.all([\n        activeClient.from("profiles").select("full_name,sport_name").eq("id", authenticatedUser.id).maybeSingle(),\n        activeClient\n          .from("user_roles")\n          .select("id,role,expires_at")\n          .eq("user_id", authenticatedUser.id),\n      ]);',
          );
          replaceExact(
            page,
            '      if (profileResult.error) setAuthError(profileResult.error.message);\n      if (rolesResult.error) setAuthError(rolesResult.error.message);\n\n      const profile = profileResult.data;\n      setDisplayName(profile?.sport_name || profile?.full_name || authenticatedUser.email || "Usuário UDK");\n      const loadedRoles = (rolesResult.data ?? [])\n        .map((item) => item.role as Role)\n        .filter((role) => role in roleAccess);\n      setRoles(loadedRoles.length > 0 ? loadedRoles : ["driver"]);\n      setReady(true);',
            '      if (profileResult.error) setAuthError(profileResult.error.message);\n      if (rolesResult.error) {\n        setRoles([]);\n        setRoleGrants([]);\n        setPermissions([]);\n        setAuthError(`Não foi possível carregar as permissões: ${rolesResult.error.message}`);\n        setReady(true);\n        return;\n      }\n\n      const profile = profileResult.data;\n      setDisplayName(profile?.sport_name || profile?.full_name || authenticatedUser.email || "Usuário UDK");\n      const now = Date.now();\n      const loadedGrants = (rolesResult.data ?? [])\n        .filter((item) => !item.expires_at || new Date(item.expires_at).getTime() > now)\n        .filter((item) => item.role in roleAccess)\n        .map((item) => ({ id: String(item.id), role: item.role as Role }));\n\n      if (loadedGrants.length === 0) {\n        setRoles([]);\n        setRoleGrants([]);\n        setPermissions([]);\n        setAuthError("Esta conta não possui papel ativo. Solicite a vinculação à organização do campeonato.");\n        setReady(true);\n        return;\n      }\n\n      const { data: permissionRows, error: permissionError } = await activeClient\n        .from("role_permissions")\n        .select("user_role_id,module,action,allowed,expires_at")\n        .in("user_role_id", loadedGrants.map((grant) => grant.id))\n        .is("deleted_at", null);\n\n      if (!active || permissionError) {\n        setRoles([]);\n        setRoleGrants([]);\n        setPermissions([]);\n        setAuthError(permissionError ? `Não foi possível validar permissões granulares: ${permissionError.message}` : "Sessão encerrada.");\n        setReady(true);\n        return;\n      }\n\n      setRoleGrants(loadedGrants);\n      setRoles(Array.from(new Set(loadedGrants.map((grant) => grant.role as Role))));\n      setPermissions((permissionRows ?? []) as RolePermission[]);\n      setReady(true);',
          );
          replaceExact(
            page,
            '  const allowedKeys = useMemo(() => {\n    const keys = new Set<string>();\n    for (const role of roles) {\n      for (const key of roleAccess[role]) keys.add(key);\n    }\n    return keys;\n  }, [roles]);',
            '  const allowedKeys = useMemo(\n    () => computeAllowedModules(roleAccess, roleGrants, permissions),\n    [permissions, roleGrants],\n  );\n  const writableKeys = useMemo(\n    () => computeWritableModules(writableModulesByRole, roleGrants, permissions),\n    [permissions, roleGrants],\n  );\n  const offlineOwner = useMemo(\n    () => (client && user ? createOfflineQueueOwner(client, user.id) : undefined),\n    [client, user],\n  );\n\n  useEffect(() => {\n    if (!offlineOwner) {\n      setOfflineCount(0);\n      return;\n    }\n    let active = true;\n    const refreshQueueCount = async () => {\n      const queue = await getOfflineQueue(offlineOwner);\n      if (active) setOfflineCount(queue.length);\n    };\n    void refreshQueueCount();\n    window.addEventListener("udk:offline-queue", refreshQueueCount);\n    return () => {\n      active = false;\n      window.removeEventListener("udk:offline-queue", refreshQueueCount);\n    };\n  }, [offlineOwner]);',
          );
          replaceExact(
            page,
            '  const authorized = activeKey === "dashboard" || allowedKeys.has(activeKey);\n  const canMutate = roles.some((role) => writableModulesByRole[role].includes(activeKey));',
            '  const authorized = allowedKeys.has(activeKey);\n  const canMutate = writableKeys.has(activeKey);',
          );
          replaceExact(page, '{roleLabels[roles[0] ?? "driver"]}', '{roles[0] ? roleLabels[roles[0]] : "Sem papel ativo"}');
          replaceExact(page, '{authError ? <div className="alert alert-warning">{authError}</div> : null}', '{authError ? <div className="alert alert-warning" role="alert">{authError}</div> : null}');
          replaceExact(page, '<Dashboard client={client} />', '<Dashboard client={client} allowedKeys={allowedKeys} />');
          replaceExact(
            page,
            ') : config ? (\n            <ModuleCrud client={client} config={effectiveConfig ?? config} />',
            ') : config && offlineOwner ? (\n            <ModuleCrud client={client} owner={offlineOwner} config={effectiveConfig ?? config} />',
          );

          const crud = 'apps/plataforma/components/module-crud.tsx';
          replaceExact(
            crud,
            'import {\n  enqueueOfflineOperation,\n  flushOfflineQueue,\n  getOfflineQueue,\n} from "../lib/offline-queue";',
            'import {\n  enqueueOfflineOperation,\n  flushOfflineQueue,\n  getOfflineQueue,\n  type OfflineQueueOwner,\n} from "../lib/offline-queue";\nimport { dateTimeLocalToIso, isoToDateTimeLocal } from "../lib/datetime";',
          );
          replaceExact(
            crud,
            'type ModuleCrudProps = {\n  client: SupabaseClient;\n  config: ModuleConfig;\n};',
            'type ModuleCrudProps = {\n  client: SupabaseClient;\n  config: ModuleConfig;\n  owner: OfflineQueueOwner;\n};',
          );
          replaceExact(crud, 'export function ModuleCrud({ client, config }: ModuleCrudProps) {', 'export function ModuleCrud({ client, config, owner }: ModuleCrudProps) {');
          replaceExact(crud, '  if (kind === "datetime") return value.slice(0, 16);', '  if (kind === "datetime") return isoToDateTimeLocal(value);');
          replaceExact(crud, '      payload[field.key] = new Date(String(raw)).toISOString();', '      payload[field.key] = dateTimeLocalToIso(String(raw));');
          replaceExact(crud, '    setPendingOffline((await getOfflineQueue()).length);', '    setPendingOffline((await getOfflineQueue(owner)).length);');
          replaceExact(crud, '      const result = await flushOfflineQueue(client);', '      const result = await flushOfflineQueue(client, owner);');
          replaceExact(crud, '  }, [client, loadRecords]);', '  }, [client, loadRecords, owner]);');
          replaceExact(crud, '      void getOfflineQueue().then((queue) => setPendingOffline(queue.length));', '      void getOfflineQueue(owner).then((queue) => setPendingOffline(queue.length));');
          replaceExact(crud, '          await enqueueOfflineOperation(\n            editing', '          await enqueueOfflineOperation(\n            owner,\n            editing');
          replaceExact(crud, '          setPendingOffline((await getOfflineQueue()).length);', '          setPendingOffline((await getOfflineQueue(owner)).length);');
          replaceExact(crud, '        await enqueueOfflineOperation({', '        await enqueueOfflineOperation(owner, {');
          replaceExact(crud, '        setPendingOffline((await getOfflineQueue()).length);', '        setPendingOffline((await getOfflineQueue(owner)).length);');
          NODE
      - name: Verify and commit integration
        run: |
          git diff --check
          grep -q 'computeAllowedModules' apps/plataforma/app/painel/[[...slug]]/page.tsx
          grep -q 'OfflineQueueOwner' apps/plataforma/components/module-crud.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/plataforma
          git commit -m "fix: enforce granular access and owned offline queues"
          git push origin HEAD:feat/complete-operational-modules

  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify workspace
        run: pnpm verify
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build both applications
        run: pnpm build
