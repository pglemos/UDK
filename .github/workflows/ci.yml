name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/complete-operational-modules]

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee verify.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log

      - name: Build unified application
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-quality-${{ github.sha }}
          path: |
            verify.log
            lint.log
            typecheck.log
            test.log
            build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce quality gates
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          printf 'verify=%s\nlint=%s\ntypecheck=%s\ntest=%s\nbuild=%s\n' \
            "$VERIFY_OUTCOME" "$LINT_OUTCOME" "$TYPECHECK_OUTCOME" "$TEST_OUTCOME" "$BUILD_OUTCOME"
          [ "$VERIFY_OUTCOME" = success ] && \
          [ "$LINT_OUTCOME" = success ] && \
          [ "$TYPECHECK_OUTCOME" = success ] && \
          [ "$TEST_OUTCOME" = success ] && \
          [ "$BUILD_OUTCOME" = success ]
