name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-admin-modules:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/complete-operational-modules
          fetch-depth: 0
      - name: Apply verified administration patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/publish-final-admin-modules.yml').read_text()
          start = source.index("          const fs = require('node:fs');")
          end = source.index("          NODE", start)
          lines = source[start:end].splitlines()
          Path('/tmp/final-admin-modules.cjs').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          node /tmp/final-admin-modules.cjs
      - name: Commit modules
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/plataforma
          git commit -m "feat: add final administration modules"
          git push origin HEAD:feat/complete-operational-modules

  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm verify

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build both applications
        run: pnpm build
