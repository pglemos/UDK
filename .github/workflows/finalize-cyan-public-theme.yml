name: Finalize public cyan theme

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-public-cyan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cyan-brand-theme
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Extend the regression contract to the public portal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("apps/plataforma/lib/theme-colors.test.ts")
          test = test_path.read_text()
          test = test.replace(
              'const css = readFileSync(new URL("../app/globals.css", import.meta.url), "utf8");',
              'const css = readFileSync(new URL("../app/globals.css", import.meta.url), "utf8");\nconst publicCss = readFileSync(new URL("../app/public.css", import.meta.url), "utf8");',
              1,
          )
          marker = '''  it("defines the approved cyan design tokens", () => {
              expect(css).toContain("--cyan: #00d9ff;");
              expect(css).toContain("--cyan-hover: #32e5ff;");
              expect(css).toContain("--cyan-deep: #00687a;");
              expect(css).toContain("--cyan-glow: #004653;");
            });
          '''
          addition = marker + '''
            it("uses cyan consistently across the public portal", () => {
              expect(publicCss).not.toMatch(/lime|#455000|#9db500|#657500|#eef5c0|#566400/i);
              expect(publicCss).toContain("--public-cyan:#00d9ff");
              expect(publicCss).toContain("--public-cyan-hover:#32e5ff");
              expect(publicCss).toContain("--public-cyan-deep:#00687a");
              expect(publicCss).toContain("--public-cyan-soft:#dffaff");
            });
          '''
          if marker not in test:
              raise SystemExit("Could not locate theme token test block")
          test = test.replace(marker, addition, 1)
          test_path.write_text(test)
          PY

      - name: Prove public portal residue is detected
        run: |
          if pnpm --filter @udk/plataforma exec vitest run lib/theme-colors.test.ts; then
            echo "Public portal cyan regression unexpectedly passed before cleanup."
            exit 1
          fi
          echo "Expected public-theme red phase confirmed."

      - name: Remove all remaining public green derivatives
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/plataforma/app/public.css")
          css = path.read_text()

          css = css.replace(
              "--public-graphite:#1c191f;--public-lime:#00d9ff;--public-canvas:#f7f5f0;",
              "--public-graphite:#1c191f;--public-cyan:#00d9ff;--public-cyan-hover:#32e5ff;--public-cyan-deep:#00687a;--public-cyan-soft:#dffaff;--public-canvas:#f7f5f0;",
              1,
          )
          css = css.replace("var(--public-lime)", "var(--public-cyan)")
          css = css.replace("#455000", "#004653")
          css = css.replace("#9db500", "#00879f")
          css = css.replace("color:#657500", "color:var(--public-cyan-deep)")
          css = css.replace("background:#eef5c0;color:#566400", "background:var(--public-cyan-soft);color:var(--public-cyan-deep)")

          button_marker = ".public-button-ghost{background:transparent;color:#fff;border:1px solid #5a555f}"
          button_replacement = button_marker + ".public-cta:hover,.public-button:hover{background:var(--public-cyan-hover)}"
          if button_marker not in css:
              raise SystemExit("Could not locate public button marker")
          css = css.replace(button_marker, button_replacement, 1)

          forbidden = ["lime", "#455000", "#9db500", "#657500", "#eef5c0", "#566400"]
          remaining = [marker for marker in forbidden if marker in css.lower()]
          if remaining:
              raise SystemExit(f"Public green residues remain: {remaining}")

          path.write_text(css)
          PY

      - name: Record final public palette coverage
        run: |
          cat >> docs/superpowers/specs/2026-07-26-cyan-brand-theme-design.md <<'EOF'

          ## Public portal coverage

          The public portal uses dedicated cyan tokens for the primary accent, hover, deep text and soft badges. Previous green glow, divider, number and status colors are prohibited by the regression test.
          EOF

      - name: Verify complete cyan contract
        run: pnpm --filter @udk/plataforma exec vitest run lib/theme-colors.test.ts

      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-cyan-public-theme.yml

      - name: Lint
        run: pnpm --filter @udk/plataforma lint

      - name: TypeScript
        run: pnpm --filter @udk/plataforma typecheck

      - name: Tests
        run: pnpm --filter @udk/plataforma test

      - name: Build
        run: pnpm --filter @udk/plataforma build

      - name: Publish final public cyan cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove remaining green accents from public portal"
          git pull --rebase origin fix/cyan-brand-theme
          git push origin HEAD:fix/cyan-brand-theme
