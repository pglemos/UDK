name: Apply operational type fixes

on:
  push:
    branches: [feat/complete-operational-modules]

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/complete-operational-modules
          fetch-depth: 0
      - name: Apply exact type fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) {
              throw new Error(`Expected source fragment not found in ${path}: ${before.slice(0, 100)}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceExact(
            'apps/plataforma/app/manifest.ts',
            'purpose: "any maskable",',
            'purpose: "maskable",',
          );

          replaceExact(
            'apps/plataforma/app/painel/[[...slug]]/page.tsx',
            '    let active = true;\n\n    async function loadIdentity() {\n      const { data: sessionData, error: sessionError } = await client.auth.getSession();',
            '    const activeClient = client;\n    let active = true;\n\n    async function loadIdentity() {\n      const { data: sessionData, error: sessionError } = await activeClient.auth.getSession();',
          );
          replaceExact(
            'apps/plataforma/app/painel/[[...slug]]/page.tsx',
            '        client.from("profiles").select("full_name,sport_name").eq("id", authenticatedUser.id).maybeSingle(),\n        client.from("user_roles").select("role").eq("user_id", authenticatedUser.id),',
            '        activeClient.from("profiles").select("full_name,sport_name").eq("id", authenticatedUser.id).maybeSingle(),\n        activeClient.from("user_roles").select("role").eq("user_id", authenticatedUser.id),',
          );
          replaceExact(
            'apps/plataforma/app/painel/[[...slug]]/page.tsx',
            '    const { data: subscription } = client.auth.onAuthStateChange((event) => {',
            '    const { data: subscription } = activeClient.auth.onAuthStateChange((event) => {',
          );

          replaceExact(
            'apps/plataforma/components/dashboard.tsx',
            '  nextStage?: {\n    title: string;\n    track: string;\n    starts_at: string;\n    status: string;\n  };',
            '  nextStage:\n    | {\n        title: string;\n        track: string;\n        starts_at: string;\n        status: string;\n      }\n    | undefined;',
          );
          replaceExact(
            'apps/plataforma/components/dashboard.tsx',
            '  pendingDocuments: 0,\n};',
            '  pendingDocuments: 0,\n  nextStage: undefined,\n};',
          );

          replaceExact(
            'apps/plataforma/components/module-crud.tsx',
            '            (data ?? []).map((row: Record<string, unknown>) => ({\n              value: String(row[valueColumn]),\n              label: String(row[relation.labelColumn] ?? row[valueColumn]),\n            })),',
            '            ((data ?? []) as unknown as Record<string, unknown>[]).map((row) => ({\n              value: String(row[valueColumn]),\n              label: String(row[relation.labelColumn] ?? row[valueColumn]),\n            })),',
          );
          replaceExact(
            'apps/plataforma/components/module-crud.tsx',
            '          enqueueOfflineOperation({\n            table: config.table,\n            action: editing ? "update" : "insert",\n            payload,\n            recordId: editing?.id,\n          });',
            '          enqueueOfflineOperation(\n            editing\n              ? { table: config.table, action: "update", payload, recordId: editing.id }\n              : { table: config.table, action: "insert", payload },\n          );',
          );

          replaceExact(
            'apps/plataforma/lib/offline-queue.test.ts',
            '    const insert: OfflineOperation = {\n      ...operation,\n      id: "operation-2",\n      action: "insert",\n      recordId: undefined,\n    };',
            '    const insert: OfflineOperation = {\n      id: "operation-2",\n      table: operation.table,\n      action: "insert",\n      payload: operation.payload,\n      createdAt: operation.createdAt,\n      attempts: operation.attempts,\n    };',
          );
          NODE
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/plataforma
          git diff --cached --check
          git commit -m "fix: satisfy strict operational types"
          git push origin HEAD:feat/complete-operational-modules
