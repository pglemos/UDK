name: Apply UDK rebuild v2

on:
  push:
    branches:
      - feat/udk-cinematic-rebuild-v2
    paths:
      - artifacts/rebuild-v2/**

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/udk-cinematic-rebuild-v2
          fetch-depth: 0

      - name: Reconstruct validated source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/udk-rebuild-v2/source
          cat artifacts/rebuild-v2/part-*.b64 | base64 --decode > /tmp/udk-rebuild-v2/source.zip
          expected="$(cat artifacts/rebuild-v2/source.sha256)"
          actual="$(sha256sum /tmp/udk-rebuild-v2/source.zip | awk '{print $1}')"
          test "$expected" = "$actual"
          unzip -oq /tmp/udk-rebuild-v2/source.zip -d /tmp/udk-rebuild-v2/source
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'artifacts/rebuild-v2/' \
            /tmp/udk-rebuild-v2/source/ ./
          rm -rf artifacts/rebuild-v2

      - name: Commit applied source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: apply cinematic UDK rebuild v2 source"
          git push origin HEAD:feat/udk-cinematic-rebuild-v2
