name: Export verified migrations

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: verified-supabase-migrations-${{ github.sha }}
          path: supabase/migrations/*.sql
          if-no-files-found: error
          retention-days: 1
