name: Visual Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/plataforma/**"
      - ".github/workflows/visual-audit.yml"

permissions:
  contents: read

jobs:
  screenshots:
    name: Desktop and mobile screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter @udk/plataforma build

      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Start application
        run: |
          pnpm --filter @udk/plataforma start -- -p 3000 > /tmp/udk-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/udk-next.log
          exit 1

      - name: Capture main routes
        run: |
          mkdir -p visual-audit
          routes=("" "calendario" "classificacao" "resultados" "pilotos" "noticias" "regulamento" "inscricao" "login")
          for route in "${routes[@]}"; do
            slug="${route:-home}"
            npx --yes playwright@1.56.1 screenshot \
              --browser=chromium \
              --viewport-size="1440,1100" \
              --full-page \
              "http://127.0.0.1:3000/${route}" \
              "visual-audit/${slug}-desktop.png"
            npx --yes playwright@1.56.1 screenshot \
              --browser=chromium \
              --device="iPhone 13" \
              --full-page \
              "http://127.0.0.1:3000/${route}" \
              "visual-audit/${slug}-mobile.png"
          done

      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        with:
          name: udk-visual-audit-${{ github.event.pull_request.head.sha }}
          path: visual-audit/*.png
          if-no-files-found: error
          retention-days: 7
