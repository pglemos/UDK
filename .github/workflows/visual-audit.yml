name: Visual Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/plataforma/**"
      - ".github/scripts/capture-visual-audit.mjs"
      - ".github/workflows/visual-audit.yml"

permissions:
  contents: read

jobs:
  screenshots:
    name: Desktop and mobile screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter @udk/plataforma build

      - name: Install isolated Playwright and Chromium
        run: |
          rm -rf /tmp/visual-audit-runner
          npm install --prefix /tmp/visual-audit-runner --ignore-scripts playwright@1.56.1
          /tmp/visual-audit-runner/node_modules/.bin/playwright install --with-deps chromium

      - name: Start application
        run: |
          pnpm --filter @udk/plataforma exec next start -p 3000 > /tmp/udk-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/udk-next.log
          exit 1

      - name: Capture and validate main routes
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/visual-audit-runner/node_modules/playwright
          VISUAL_AUDIT_BROWSER_CHANNEL: chrome
        run: node .github/scripts/capture-visual-audit.mjs

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: udk-visual-audit-${{ github.event.pull_request.head.sha }}
          path: visual-audit/*
          if-no-files-found: warn
          retention-days: 7
