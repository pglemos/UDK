name: Import Official UDK Media

on:
  push:
    branches:
      - feat/official-media-integration-20260806
    paths:
      - .github/workflows/import-official-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/official-media-integration-20260806
          fetch-depth: 0

      - name: Download curated media package
        env:
          DRIVE_FILE_ID: 1QDGW1v55Hye0idPt02zeN_tohlUB7Wjb
          EXPECTED_SHA256: 8899e7436ca8df6fc573c043a33bc88e5f6eb26c1c45719651751091d386f267
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t" \
            --output /tmp/udk-official-media-import.zip
          echo "${EXPECTED_SHA256}  /tmp/udk-official-media-import.zip" | sha256sum --check --strict

      - name: Extract and validate official assets
        run: |
          set -euo pipefail
          unzip -q /tmp/udk-official-media-import.zip -d .
          test -f apps/plataforma/public/media/official/source-manifest.json
          test -f apps/plataforma/public/media/official/home/hero-loop.mp4
          test -f apps/plataforma/public/media/official/heroes/resultados.webp
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("apps/plataforma/public/media/official")
          manifest = json.loads((root / "source-manifest.json").read_text(encoding="utf-8"))
          paths = {item["path"] for item in manifest["assets"]}
          files = {
              "/media/official/" + str(path.relative_to(root)).replace("\\", "/")
              for path in root.rglob("*")
              if path.is_file() and path.name != "source-manifest.json"
          }
          if paths != files:
              raise SystemExit(f"Manifest mismatch: missing={sorted(files-paths)} extra={sorted(paths-files)}")
          if any(path.stat().st_size <= 1024 for path in root.rglob("*") if path.is_file()):
              raise SystemExit("Official asset smaller than 1 KiB")
          print(f"Validated {len(files)} official media files")
          PY

      - name: Commit imported assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/plataforma/public/media/official
          if git diff --cached --quiet; then
            echo "No media changes to commit"
            exit 0
          fi
          git commit -m "assets: add optimized official UDK media"
          git push origin HEAD:feat/official-media-integration-20260806
