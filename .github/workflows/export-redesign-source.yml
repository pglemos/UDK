name: Export redesign source

on:
  push:
    branches:
      - feat/twice-grind-redesign

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove Git metadata
        run: rm -rf .git
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: udk-redesign-source
          path: .
          include-hidden-files: true
          retention-days: 1
