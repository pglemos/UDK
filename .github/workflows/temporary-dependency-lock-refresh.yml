name: Temporary Dependency Lock Refresh

on:
  push:
    branches:
      - chore/final-dependency-alignment-20260818

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/final-dependency-alignment-20260818
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - name: Align dependencies and lockfile
        run: |
          pnpm add -Dw vitest@4.1.10 --save-exact
          pnpm --filter @udk/plataforma add react-dom@19.2.8 --save-exact
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/plataforma/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: align Vitest and react-dom dependencies"
          git push origin HEAD:chore/final-dependency-alignment-20260818
