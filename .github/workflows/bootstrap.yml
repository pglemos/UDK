name: Diagnose UDK platform
on:
  push:
    branches: [feat/deploy-ready-platform]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deploy-ready-platform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-apps.mjs
      - run: corepack enable && pnpm install --no-frozen-lockfile --reporter=silent
      - name: Lint and persist diagnostics
        run: |
          if ! pnpm lint > lint.log 2>&1; then
            tail -n 160 lint.log > lint-diagnostics.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lint-diagnostics.txt
            git commit -m "ci: capture lint diagnostics"
            git push origin HEAD:feat/deploy-ready-platform
            exit 1
          fi
