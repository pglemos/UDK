name: Build deploy-ready UDK platform
on:
  push:
    branches: [feat/deploy-ready-platform]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build-platform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deploy-ready-platform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate applications
        run: |
          node scripts/generate-apps.mjs
          node scripts/patch-generated.mjs
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile --reporter=silent
      - name: Verify application and database
        run: |
          set +e
          : > verification.log
          status=0
          failed_check=""
          run_check() {
            if [ "$status" -eq 0 ]; then
              label="$1"
              shift
              echo "### $label" >> verification.log
              "$@" >> verification.log 2>&1
              status=$?
              if [ "$status" -ne 0 ]; then
                failed_check="$label"
              fi
            fi
          }
          run_check "workspace" pnpm verify
          run_check "lint" pnpm lint
          run_check "typecheck" pnpm typecheck
          run_check "tests" pnpm test
          run_check "build" pnpm build
          run_check "supabase-start" supabase start
          run_check "supabase-reset" supabase db reset
          run_check "supabase-tests" supabase test db
          run_check "supabase-lint" supabase db lint --level warning
          if [ "$status" -ne 0 ]; then
            {
              echo "failed_check=$failed_check"
              echo "exit_code=$status"
              echo "generated_layout_patch=$(grep -c 'Array<\[string, string\]>' apps/web-publico/app/layout.tsx)"
              echo "generated_home_patch=$(grep -c 'const nextStage=' apps/web-publico/app/page.tsx)"
              echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              tail -n 260 verification.log
            } > verification-diagnostics.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add verification-diagnostics.txt
            git commit --allow-empty -m "ci: capture $failed_check diagnostics"
            git push origin HEAD:feat/deploy-ready-platform
            exit "$status"
          fi
      - name: Commit verified platform
        run: |
          rm -f verification.log verification-diagnostics.txt lint-diagnostics.txt
          rm -f scripts/generate-apps.mjs scripts/patch-generated.mjs
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deliver deploy-ready UDK platform"
          git push origin HEAD:feat/deploy-ready-platform
