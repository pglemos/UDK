name: Diagnose UDK platform
on:
  push:
    branches: [feat/deploy-ready-platform]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deploy-ready-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-apps.mjs
      - run: corepack enable && pnpm install --no-frozen-lockfile --reporter=silent
      - run: pnpm lint
