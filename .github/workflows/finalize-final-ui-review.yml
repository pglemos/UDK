name: Finalize accessibility and offline resilience

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: final-contract-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-operational-modules
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Implement final contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              return text.replace(old, new, 1)

          offline_path = Path("apps/plataforma/lib/offline-queue.ts")
          offline = offline_path.read_text()
          offline = replace_once(
              offline,
              "  attempts: number;\n};",
              "  attempts: number;\n  lastError?: string;\n  lastAttemptAt?: string;\n  deadLetteredAt?: string;\n};",
              "offline metadata",
          )
          offline = replace_once(
              offline,
              'const SEQUENCE_KEY = "sequence";',
              'const SEQUENCE_KEY = "sequence";\nconst DEAD_LETTER_KEY = "encrypted-dead-letter";\n\nexport const MAX_OFFLINE_ATTEMPTS = 5;',
              "retry constants",
          )
          offline = replace_once(
              offline,
              "let memoryQueue: OfflineOperation[] = [];",
              "let memoryQueue: OfflineOperation[] = [];\nlet memoryDeadLetters: OfflineOperation[] = [];",
              "memory quarantine",
          )

          quarantine_helpers = '''async function readRawDeadLetters(): Promise<OfflineOperation[]> {
            if (typeof window === "undefined") return [];
            if (!indexedDbAvailable()) return memoryDeadLetters;

            try {
              const envelope = await readValue<EncryptedOfflineQueue>(DEAD_LETTER_KEY);
              if (!envelope) return [];
              return await decryptOfflineQueue(envelope, await getEncryptionKey());
            } catch {
              return [];
            }
          }

          async function saveRawDeadLetters(queue: OfflineOperation[]): Promise<void> {
            if (typeof window === "undefined") return;
            if (!indexedDbAvailable()) {
              memoryDeadLetters = queue;
              return;
            }
            const encrypted = await encryptOfflineQueue(queue, await getEncryptionKey());
            await writeValue(DEAD_LETTER_KEY, encrypted);
          }

          '''
          queue_reader = "export async function getOfflineQueue(owner: OfflineQueueOwner): Promise<OfflineOperation[]> {"
          reader_index = offline.index(queue_reader)
          offline = offline[:reader_index] + quarantine_helpers + offline[reader_index:]

          failure_handler = '''export type OfflineFailureResult =
            | { status: "retry"; operation: OfflineOperation }
            | { status: "dead-letter"; operation: OfflineOperation };

          export function recordOfflineFailure(
            operation: OfflineOperation,
            error: unknown,
            attemptedAt = new Date().toISOString(),
          ): OfflineFailureResult {
            const attempts = operation.attempts + 1;
            const message = error instanceof Error ? error.message : String(error);
            const failedOperation: OfflineOperation = {
              ...operation,
              attempts,
              lastError: message,
              lastAttemptAt: attemptedAt,
            };

            if (attempts >= MAX_OFFLINE_ATTEMPTS) {
              return {
                status: "dead-letter",
                operation: { ...failedOperation, deadLetteredAt: attemptedAt },
              };
            }
            return { status: "retry", operation: failedOperation };
          }

          '''
          execute_marker = "async function executeOperation(client: SupabaseClient, operation: OfflineOperation): Promise<void> {"
          execute_index = offline.index(execute_marker)
          offline = offline[:execute_index] + failure_handler + offline[execute_index:]

          flush_start = offline.index("export async function flushOfflineQueue(")
          offline = offline[:flush_start] + '''export async function flushOfflineQueue(
            client: SupabaseClient,
            owner: OfflineQueueOwner,
          ): Promise<{ completed: number; remaining: number; deadLettered: number }> {
            return withWriteLock(async () => {
              const initialQueue = await readRawQueue();
              const ownerQueue = filterOfflineQueueForOwner(initialQueue, owner).sort(
                (left, right) =>
                  left.createdAt.localeCompare(right.createdAt) ||
                  left.deviceId.localeCompare(right.deviceId) ||
                  left.sequence - right.sequence,
              );
              const snapshotIds = new Set(ownerQueue.map((operation) => operation.id));
              const failures: OfflineOperation[] = [];
              const deadLetters: OfflineOperation[] = [];
              let completed = 0;

              for (const operation of ownerQueue) {
                try {
                  await executeOperation(client, operation);
                  completed += 1;
                } catch (operationError) {
                  const failure = recordOfflineFailure(operation, operationError);
                  if (failure.status === "dead-letter") deadLetters.push(failure.operation);
                  else failures.push(failure.operation);
                }
              }

              const currentQueue = await readRawQueue();
              const operationsFromOtherOwners = currentQueue.filter(
                (operation) => !belongsToOwner(operation, owner),
              );
              const newlyQueuedForOwner = currentQueue.filter(
                (operation) => belongsToOwner(operation, owner) && !snapshotIds.has(operation.id),
              );
              const merged = [...operationsFromOtherOwners, ...failures, ...newlyQueuedForOwner];
              const unique = Array.from(
                new Map(merged.map((operation) => [operation.id, operation])).values(),
              );
              await saveRawQueue(unique);

              if (deadLetters.length > 0) {
                const existingDeadLetters = await readRawDeadLetters();
                const quarantined = Array.from(
                  new Map(
                    [...existingDeadLetters, ...deadLetters].map((operation) => [operation.id, operation]),
                  ).values(),
                );
                await saveRawDeadLetters(quarantined);
              }

              return {
                completed,
                remaining: failures.length + newlyQueuedForOwner.length,
                deadLettered: deadLetters.length,
              };
            });
          }
          '''
          offline_path.write_text(offline)

          crud_path = Path("apps/plataforma/components/module-crud.tsx")
          crud = crud_path.read_text()
          crud = replace_once(
              crud,
              'import { useCallback, useEffect, useMemo, useState } from "react";',
              'import { useCallback, useEffect, useMemo, useRef, useState } from "react";',
              "useRef import",
          )
          crud = replace_once(
              crud,
              "  const [pendingOffline, setPendingOffline] = useState(0);\n",
              "  const [pendingOffline, setPendingOffline] = useState(0);\n  const modalRef = useRef<HTMLElement>(null);\n  const previousFocusRef = useRef<HTMLElement | null>(null);\n  const savingRef = useRef(false);\n",
              "modal refs",
          )

          focus_effect = '''  useEffect(() => {
            savingRef.current = saving;
          }, [saving]);

          useEffect(() => {
            if (!modalOpen) return;
            previousFocusRef.current =
              document.activeElement instanceof HTMLElement ? document.activeElement : null;
            const modal = modalRef.current;
            if (!modal) return;

            const selector = [
              'a[href]',
              'button:not([disabled])',
              'input:not([disabled])',
              'select:not([disabled])',
              'textarea:not([disabled])',
              '[tabindex]:not([tabindex="-1"])',
            ].join(',');
            const focusable = Array.from(modal.querySelectorAll<HTMLElement>(selector));
            (focusable[0] ?? modal).focus();

            const handleKeyDown = (event: KeyboardEvent) => {
              if (event.key === 'Escape' && !savingRef.current) {
                event.preventDefault();
                setModalOpen(false);
                return;
              }
              if (event.key !== 'Tab') return;
              const activeFocusable = Array.from(
                modal.querySelectorAll<HTMLElement>(selector),
              );
              if (activeFocusable.length === 0) {
                event.preventDefault();
                modal.focus();
                return;
              }
              const first = activeFocusable[0];
              const last = activeFocusable[activeFocusable.length - 1];
              if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last?.focus();
              } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first?.focus();
              }
            };

            document.addEventListener('keydown', handleKeyDown);
            return () => {
              document.removeEventListener('keydown', handleKeyDown);
              previousFocusRef.current?.focus();
              previousFocusRef.current = null;
            };
          }, [modalOpen]);

          '''
          load_marker = "  const loadRelations = useCallback(async () => {"
          load_index = crud.index(load_marker)
          crud = crud[:load_index] + focus_effect + crud[load_index:]

          sync_pattern = re.compile(
              r"  const syncOffline = useCallback\(async \(\) => \{.*?\n  \}, \[client, loadRecords, owner\]\);",
              re.DOTALL,
          )
          sync_replacement = '''  const syncOffline = useCallback(async () => {
            setError("");
            setNotice("");
            try {
              setPendingOffline((await getOfflineQueue(owner)).length);
              if (!navigator.onLine) return;
              const result = await flushOfflineQueue(client, owner);
              setPendingOffline(result.remaining);
              if (result.deadLettered > 0) {
                setError(
                  `${result.deadLettered} operação(ões) excederam o limite de tentativas e foram movidas para a quarentena offline.`,
                );
              } else if (result.completed > 0) {
                setNotice(`${result.completed} operação(ões) sincronizada(s).`);
              }
              if (result.completed > 0 || result.deadLettered > 0) await loadRecords();
            } catch (syncError) {
              setError(
                syncError instanceof Error
                  ? syncError.message
                  : "Não foi possível sincronizar a fila offline.",
              );
            }
          }, [client, loadRecords, owner]);'''
          crud, sync_count = sync_pattern.subn(sync_replacement, crud, count=1)
          if sync_count != 1:
              raise SystemExit(f"sync handler: expected one match, found {sync_count}")

          crud = replace_once(
              crud,
              '<div className="modal" role="dialog" aria-modal="true" aria-labelledby="module-modal-title" onMouseDown={(event) => event.stopPropagation()}>',
              '<div ref={modalRef} className="modal" role="dialog" aria-modal="true" aria-labelledby="module-modal-title" tabIndex={-1} onMouseDown={(event) => event.stopPropagation()}>',
              "modal focus target",
          )
          crud = replace_once(
              crud,
              'aria-label="Fechar formulário"',
              'aria-label="Fechar modal"',
              "close label",
          )
          crud_path.write_text(crud)
          PY

      - name: Remove temporary repair workflows before verification
        run: |
          rm -f .github/workflows/apply-final-ui-review.yml
          rm -f .github/workflows/finalize-final-ui-review.yml

      - name: Verify final application
        run: |
          pnpm --filter @udk/plataforma lint
          pnpm --filter @udk/plataforma typecheck
          pnpm --filter @udk/plataforma test
          pnpm --filter @udk/plataforma build

      - name: Publish verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close accessibility and offline resilience findings"
          git pull --rebase origin feat/complete-operational-modules
          git push origin HEAD:feat/complete-operational-modules
