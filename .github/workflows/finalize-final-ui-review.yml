name: Finalize final UI review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: final-ui-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-operational-modules
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Apply patch only when missing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/plataforma/components/module-crud.tsx")
          text = path.read_text()

          if "const modalRef = useRef<HTMLElement>(null);" not in text:
            def sub_once(pattern: str, replacement: str, flags: int = 0) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                raise SystemExit(f"Expected one structural match, found {count}: {pattern[:140]}")

            sub_once(
              re.escape('import { useCallback, useEffect, useMemo, useState } from "react";'),
              'import { useCallback, useEffect, useMemo, useRef, useState } from "react";',
            )
            sub_once(
              r'(  const \[record, setRecord\] = useState<Record<string, unknown>>\(\{\}\);\n)',
              r'''\1  const modalRef = useRef<HTMLElement>(null);
            const previousFocusRef = useRef<HTMLElement | null>(null);
            const savingRef = useRef(false);
          ''',
            )
            sub_once(
              r'(  const title = config\.singular\.toLowerCase\(\);\n\n)',
              r'''\1  useEffect(() => {
              savingRef.current = saving;
            }, [saving]);

            useEffect(() => {
              if (!modalOpen) return;
              previousFocusRef.current = document.activeElement instanceof HTMLElement
                ? document.activeElement
                : null;
              const modal = modalRef.current;
              if (!modal) return;

              const focusableSelector = [
                'a[href]',
                'button:not([disabled])',
                'input:not([disabled])',
                'select:not([disabled])',
                'textarea:not([disabled])',
                '[tabindex]:not([tabindex="-1"])',
              ].join(',');
              const focusable = Array.from(
                modal.querySelectorAll<HTMLElement>(focusableSelector),
              ).filter((element) => !element.hasAttribute('hidden'));
              (focusable[0] ?? modal).focus();

              const handleKeyDown = (event: KeyboardEvent) => {
                if (event.key === 'Escape' && !savingRef.current) {
                  event.preventDefault();
                  setModalOpen(false);
                  return;
                }
                if (event.key !== 'Tab') return;
                const activeFocusable = Array.from(
                  modal.querySelectorAll<HTMLElement>(focusableSelector),
                ).filter((element) => !element.hasAttribute('hidden'));
                if (activeFocusable.length === 0) {
                  event.preventDefault();
                  modal.focus();
                  return;
                }
                const first = activeFocusable[0];
                const last = activeFocusable[activeFocusable.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                  event.preventDefault();
                  last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                  event.preventDefault();
                  first.focus();
                }
              };

              document.addEventListener('keydown', handleKeyDown);
              return () => {
                document.removeEventListener('keydown', handleKeyDown);
                previousFocusRef.current?.focus();
                previousFocusRef.current = null;
              };
            }, [modalOpen]);

          ''',
            )
            sub_once(
              r'''  async function syncOffline\(\) \{.*?\n  \}\n\n  function renderField''',
              '''  async function syncOffline() {
              if (!offlineOwner) return;
              setError("");
              setNotice("");
              try {
                const result = await flushOfflineQueue(client, offlineOwner);
                setPending((await getOfflineQueue(offlineOwner)).length);
                if (result.deadLettered > 0) {
                  setError(
                    `${result.deadLettered} operação(ões) excederam o limite de tentativas e foram movidas para a quarentena offline.`,
                  );
                } else {
                  setNotice(`${result.completed} operação(ões) sincronizada(s).`);
                }
                await loadRows();
              } catch (syncError) {
                setError(
                  syncError instanceof Error
                    ? syncError.message
                    : "Não foi possível sincronizar a fila offline.",
                );
              }
            }

            function renderField''',
              re.DOTALL,
            )
            sub_once(
              r'''          <div\s+className="modal-backdrop".*?<section className="crud-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">''',
              '''          <div
                    className="modal-backdrop"
                    onMouseDown={(event) => {
                      if (event.target === event.currentTarget && !saving) setModalOpen(false);
                    }}
                  >
                    <section
                      ref={modalRef}
                      className="crud-modal"
                      role="dialog"
                      aria-modal="true"
                      aria-labelledby="modal-title"
                      tabIndex={-1}
                    >''',
              re.DOTALL,
            )
            sub_once(
              re.escape('''                <button type="button" className="icon-button" onClick={() => setModalOpen(false)} disabled={saving}>
                          <X size={18} />
                        </button>'''),
              '''                <button
                          type="button"
                          className="icon-button"
                          aria-label="Fechar modal"
                          onClick={() => setModalOpen(false)}
                          disabled={saving}
                        >
                          <X size={18} />
                        </button>''',
            )
            path.write_text(text)

          required = [
            "const modalRef = useRef<HTMLElement>(null);",
            "result.deadLettered > 0",
            'aria-label="Fechar modal"',
            "previousFocusRef.current?.focus();",
          ]
          final_text = path.read_text()
          missing = [marker for marker in required if marker not in final_text]
          if missing:
            raise SystemExit(f"Missing final UI markers: {missing}")
          PY

      - name: Verify final application
        run: |
          pnpm --filter @udk/plataforma lint
          pnpm --filter @udk/plataforma typecheck
          pnpm --filter @udk/plataforma test
          pnpm --filter @udk/plataforma build

      - name: Remove temporary workflows and publish
        run: |
          rm -f .github/workflows/apply-final-ui-review.yml
          rm -f .github/workflows/finalize-final-ui-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "fix: close final accessibility and offline review findings"
          git pull --rebase origin feat/complete-operational-modules
          git push origin HEAD:feat/complete-operational-modules
