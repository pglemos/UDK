name: Apply Official Home Media

on:
  push:
    branches:
      - feat/official-media-integration-20260806
    paths:
      - .github/workflows/apply-official-home-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-home-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/official-media-integration-20260806
          fetch-depth: 0

      - name: Replace static Home hero with motion-aware component
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/plataforma/app/page.tsx")
          source = path.read_text(encoding="utf-8")

          import_anchor = 'import { DriverPoster, EditorialEmpty, EditorialHeading, StageProject } from "../components/race/editorial-primitives";\n'
          media_import = 'import { HomeHeroMediaLayer } from "../components/race/home-hero-media";\n'
          if media_import not in source:
              if import_anchor not in source:
                  raise SystemExit("Home media import anchor not found")
              source = source.replace(import_anchor, import_anchor + media_import, 1)

          replacement = '          <HomeHeroMediaLayer />\n'
          if replacement not in source:
              start_marker = '          <div className="cinema-home-hero-media" aria-hidden="true">\n'
              end_marker = '          </div>\n'
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit("Static Home hero start marker not found")
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit("Static Home hero end marker not found")
              end += len(end_marker)
              source = source[:start] + replacement + source[end:]

          path.write_text(source, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify focused implementation
        run: |
          pnpm --filter @udk/plataforma test -- tests/official-media.test.ts
          pnpm --filter @udk/plataforma lint
          pnpm --filter @udk/plataforma typecheck

      - name: Commit Home integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/plataforma/app/page.tsx
          if git diff --cached --quiet; then
            echo "Home integration already applied"
            exit 0
          fi
          git commit -m "feat: integrate motion-aware official Home hero"
          git push origin HEAD:feat/official-media-integration-20260806
