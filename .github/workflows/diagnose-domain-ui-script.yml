name: Publish domain UI patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-operational-modules
          fetch-depth: 0
      - name: Extract and execute patch script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-operational-domain-ui.yml').read_text()
          start = source.index("          const fs = require('node:fs');")
          end = source.index("          NODE", start)
          lines = source[start:end].splitlines()
          Path('/tmp/domain-ui-patch.cjs').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          node /tmp/domain-ui-patch.cjs
      - name: Verify generated files
        run: |
          git diff --check
          grep -q 'key: "responsaveis"' apps/plataforma/lib/module-config.ts
          grep -q 'key: "campanhas"' apps/plataforma/lib/module-config.ts
          grep -q '"versoes-conteudo"' apps/plataforma/app/painel/[[...slug]]/page.tsx
      - name: Commit generated modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/plataforma
          git commit -m "feat: expose all operational domains"
          git push origin HEAD:feat/complete-operational-modules
