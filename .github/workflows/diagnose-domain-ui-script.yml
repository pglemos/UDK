name: Export domain UI patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and execute patch script
        id: patch
        shell: bash
        run: |
          mkdir -p diagnostics
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-operational-domain-ui.yml').read_text()
          start = source.index("          const fs = require('node:fs');")
          end = source.index("          NODE", start)
          lines = source[start:end].splitlines()
          Path('/tmp/domain-ui-patch.cjs').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          set +e
          node /tmp/domain-ui-patch.cjs > diagnostics/domain-ui-script.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload patched files
        if: steps.patch.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: domain-ui-patched-files
          path: |
            apps/plataforma/lib/module-config.ts
            apps/plataforma/lib/module-config.test.ts
            apps/plataforma/app/painel/[[...slug]]/page.tsx
          retention-days: 3
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: domain-ui-script-diagnostics
          path: diagnostics/domain-ui-script.txt
          retention-days: 3
      - name: Fail when script failed
        if: steps.patch.outputs.status != '0'
        run: exit 1
