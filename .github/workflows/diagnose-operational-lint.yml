name: Diagnose operational quality

on:
  push:
    branches: [feat/complete-operational-modules]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture quality output
        id: quality
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          pnpm lint > diagnostics/lint.txt 2>&1
          lint_status=$?
          pnpm typecheck > diagnostics/typecheck.txt 2>&1
          typecheck_status=$?
          echo "lint_status=$lint_status" >> "$GITHUB_OUTPUT"
          echo "typecheck_status=$typecheck_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: operational-quality-diagnostics
          path: diagnostics
          retention-days: 3
      - name: Fail when quality failed
        if: steps.quality.outputs.lint_status != '0' || steps.quality.outputs.typecheck_status != '0'
        run: exit 1
