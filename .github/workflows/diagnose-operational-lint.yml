name: Diagnose operational lint

on:
  push:
    branches: [feat/complete-operational-modules]

permissions:
  contents: read

jobs:
  lint-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture lint output
        id: lint
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          pnpm lint > diagnostics/lint.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: operational-lint-diagnostics
          path: diagnostics/lint.txt
          retention-days: 3
      - name: Fail when lint failed
        if: steps.lint.outputs.status != '0'
        run: exit 1
