name: Audit official UDK brand

on:
  push:
    branches: [fix/official-udk-brand-assets]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build repository brand audit
        run: |
          set -euo pipefail
          {
            echo '# UDK repository brand audit'
            echo
            echo '## Repository files'
            find . -type f \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              -not -path './.next/*' \
              | sort
            echo
            echo '## Font declarations and imports'
            grep -RInE 'font-family|fonts\.googleapis|Barlow|Inter|Roboto' \
              apps packages docs README.md \
              --exclude='pnpm-lock.yaml' || true
            echo
            echo '## Logo, icon and image references'
            grep -RInE 'udk\.svg|logo|favicon|apple-touch|manifest|<img|Image\(' \
              apps packages docs README.md \
              --exclude='pnpm-lock.yaml' || true
            echo
            echo '## Existing public assets'
            find apps/plataforma/public -maxdepth 4 -type f -print -exec file {} \; -exec sha256sum {} \; 2>/dev/null | sort || true
            echo
            echo '## Brand-like colors and tokens'
            grep -RInEi '#1c191f|#ffffff|#00d9ff|#dafc08|lime|cyan|graphite|theme_color|themeColor' \
              apps packages docs README.md \
              --exclude='pnpm-lock.yaml' || true
            echo
            echo '## Package scripts and test layout'
            find . -name package.json -not -path './node_modules/*' -print -exec cat {} \;
            echo
            echo '## Git status'
            git status --short
          } > brand-audit.txt

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='brand-audit.txt' \
            -czf source-snapshot.tar.gz .

          cat brand-audit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: official-brand-audit
          path: |
            brand-audit.txt
            source-snapshot.tar.gz
          if-no-files-found: error
