name: Finalize official UDK brand

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-official-udk-brand
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/official-udk-brand-assets
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Apply exact official brand assets
        run: |
          set -o pipefail
          python3 scripts/apply_official_brand.py 2>&1 | tee apply-official-brand.log

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-brand-migration-log
          path: apply-official-brand.log
          if-no-files-found: warn

      - name: Remove temporary migration infrastructure
        run: |
          rm -f .github/workflows/apply-official-brand-assets.yml
          rm -f .github/workflows/audit-official-brand.yml
          rm -rf .brand-payload
          rm -f scripts/official_brand_payload_a.py
          rm -f scripts/official_brand_payload_b.py
          rm -f scripts/apply_official_brand.py
          rm -f apply-official-brand.log

      - name: Verify official asset hashes and references
        run: pnpm --filter @udk/plataforma exec vitest run lib/brand-assets.test.ts

      - name: Verify workspace
        run: pnpm verify

      - name: Lint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish verified official brand correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: adopt official UDK brand assets across all surfaces"
          git pull --rebase origin fix/official-udk-brand-assets
          git push origin HEAD:fix/official-udk-brand-assets
