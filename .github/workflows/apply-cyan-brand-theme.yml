name: Apply cyan brand theme

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cyan-brand-theme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cyan-brand-theme
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Add cyan theme regression contract
        run: |
          cat > apps/plataforma/lib/theme-colors.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const css = readFileSync(new URL("../app/globals.css", import.meta.url), "utf8");

          function relativeLuminance(hex: string): number {
            const value = hex.replace("#", "");
            const channels = [0, 2, 4].map((offset) => Number.parseInt(value.slice(offset, offset + 2), 16) / 255);
            const linear = channels.map((channel) =>
              channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4,
            );
            return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
          }

          function contrast(first: string, second: string): number {
            const firstLuminance = relativeLuminance(first);
            const secondLuminance = relativeLuminance(second);
            return (Math.max(firstLuminance, secondLuminance) + 0.05) /
              (Math.min(firstLuminance, secondLuminance) + 0.05);
          }

          describe("UDK cyan brand theme", () => {
            it("removes the retired lime accent and hard-coded lime derivatives", () => {
              expect(css).not.toMatch(/--lime(?:-dark)?/i);
              expect(css).not.toMatch(/#dafc08|#687700|#526000/i);
              expect(css).not.toMatch(/rgba\(218,\s*252,\s*8,/i);
              expect(css).not.toMatch(/rgba\(150,\s*174,\s*0,/i);
            });

            it("defines the approved cyan design tokens", () => {
              expect(css).toContain("--cyan: #00d9ff;");
              expect(css).toContain("--cyan-hover: #32e5ff;");
              expect(css).toContain("--cyan-deep: #00687a;");
              expect(css).toContain("--cyan-glow: #004653;");
            });

            it("keeps accessible contrast for primary and text uses", () => {
              expect(contrast("#00d9ff", "#1c191f")).toBeGreaterThanOrEqual(4.5);
              expect(contrast("#00687a", "#ffffff")).toBeGreaterThanOrEqual(4.5);
            });
          });
          EOF

      - name: Prove the regression contract fails on the old green theme
        run: |
          if pnpm --filter @udk/plataforma exec vitest run lib/theme-colors.test.ts; then
            echo "The cyan regression contract unexpectedly passed before implementation."
            exit 1
          fi
          echo "Expected red phase confirmed."

      - name: Replace the green system with the approved cyan system
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path("apps/plataforma/app/globals.css")
          css = css_path.read_text()

          replacements = [
              ("--lime-dark", "--cyan-deep"),
              ("--lime", "--cyan"),
              ("#dafc08", "#00d9ff"),
              ("#DAFC08", "#00D9FF"),
              ("#687700", "#00687a"),
              ("#526000", "#004653"),
              ("rgba(218, 252, 8,", "rgba(0, 217, 255,"),
              ("rgba(150, 174, 0, 0.2)", "rgba(0, 151, 178, 0.26)"),
          ]

          for old, new in replacements:
              css = css.replace(old, new)

          root_marker = "  --cyan: #00d9ff;\n  --cyan-deep: #00687a;"
          root_replacement = (
              "  --cyan: #00d9ff;\n"
              "  --cyan-hover: #32e5ff;\n"
              "  --cyan-deep: #00687a;\n"
              "  --cyan-glow: #004653;"
          )
          if root_marker not in css:
              raise SystemExit("Could not locate cyan root token marker after replacement")
          css = css.replace(root_marker, root_replacement, 1)

          css = css.replace(
              "radial-gradient(circle at 78% 22%, #004653 0, transparent 28rem)",
              "radial-gradient(circle at 78% 22%, var(--cyan-glow) 0, transparent 28rem)",
          )

          hover_marker = '''.button-primary:hover,
          .button-secondary:hover,
          .login-submit:hover {
            transform: translateY(-1px);
          }
          '''
          hover_replacement = hover_marker + '''
          .button-primary:hover,
          .login-submit:hover {
            background: var(--cyan-hover);
            box-shadow: 0 12px 28px rgba(0, 151, 178, 0.3);
          }

          :where(a, button, input, select, textarea):focus-visible {
            outline: 3px solid var(--cyan);
            outline-offset: 3px;
          }
          '''
          if hover_marker not in css:
              raise SystemExit("Could not locate button hover marker")
          css = css.replace(hover_marker, hover_replacement, 1)

          css_path.write_text(css)

          forbidden = [
              "--lime",
              "#dafc08",
              "#687700",
              "#526000",
              "rgba(218, 252, 8,",
              "rgba(150, 174, 0,",
          ]
          problems = []
          for path in Path("apps/plataforma").rglob("*"):
              if path.suffix not in {".css", ".ts", ".tsx", ".js", ".jsx"}:
                  continue
              text = path.read_text(errors="ignore").lower()
              for marker in forbidden:
                  if marker.lower() in text and path.name != "theme-colors.test.ts":
                      problems.append(f"{path}: {marker}")
          if problems:
              raise SystemExit("Legacy green markers remain:\n" + "\n".join(problems))
          PY

      - name: Document the approved visual system
        run: |
          mkdir -p docs/superpowers/specs
          cat > docs/superpowers/specs/2026-07-26-cyan-brand-theme-design.md <<'EOF'
          # UDK Cyan Brand Theme

          ## Objective

          Align the unified UDK website with the cyan used across current uniforms, karting materials and campaign assets, replacing the retired lime-green digital accent without weakening accessibility or semantic status colors.

          ## Approved palette

          - Graphite base: `#1C191F`
          - Electric cyan accent: `#00D9FF`
          - Cyan hover: `#32E5FF`
          - Deep cyan for text and borders on light surfaces: `#00687A`
          - Dark cyan glow: `#004653`
          - White: `#FFFFFF`
          - Alert red remains semantic and is not recolored.
          - Success green remains semantic and is not used as a brand accent.

          ## Application rules

          The cyan accent is applied to primary actions, active navigation, loading indicators, highlights, focus rings, decorative gradients and interactive icons. Deep cyan is used where bright cyan would fail contrast on white. Graphite remains the dominant structural color so the interface stays premium rather than becoming a fluorescent aquarium.

          ## Accessibility

          Primary cyan against graphite exceeds WCAG AA contrast for normal text. Deep cyan against white also exceeds WCAG AA. Keyboard focus receives a visible three-pixel cyan outline with offset.

          ## Regression protection

          Automated tests reject the retired `--lime` tokens, the old lime hexadecimal values and their hard-coded RGB derivatives. The same tests verify the approved tokens and contrast ratios.
          EOF

      - name: Verify the cyan contract passes
        run: pnpm --filter @udk/plataforma exec vitest run lib/theme-colors.test.ts

      - name: Remove temporary implementation workflow
        run: rm -f .github/workflows/apply-cyan-brand-theme.yml

      - name: Lint
        run: pnpm --filter @udk/plataforma lint

      - name: TypeScript
        run: pnpm --filter @udk/plataforma typecheck

      - name: Tests
        run: pnpm --filter @udk/plataforma test

      - name: Build
        run: pnpm --filter @udk/plataforma build

      - name: Publish verified cyan theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align UDK interface with cyan brand system"
          git pull --rebase origin fix/cyan-brand-theme
          git push origin HEAD:fix/cyan-brand-theme
