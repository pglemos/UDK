name: Finalize contract repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: final-contract-publisher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-operational-modules
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Apply the verified repair script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/finalize-final-ui-review.yml").read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path("/tmp/final_contract_repair.py").write_text(script)
          PY
          python3 /tmp/final_contract_repair.py

      - name: Remove obsolete repair workflows
        run: |
          rm -f .github/workflows/apply-final-ui-review.yml
          rm -f .github/workflows/finalize-final-ui-review.yml

      - name: Lint
        run: pnpm --filter @udk/plataforma lint

      - name: TypeScript
        run: pnpm --filter @udk/plataforma typecheck

      - name: Tests
        run: pnpm --filter @udk/plataforma test

      - name: Build
        run: pnpm --filter @udk/plataforma build

      - name: Publish verified repair
        run: |
          rm -f .github/workflows/finalize-contract-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close accessibility and offline resilience findings"
          git pull --rebase origin feat/complete-operational-modules
          git push origin HEAD:feat/complete-operational-modules
