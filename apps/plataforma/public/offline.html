<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#08090c" />
    <title>UDK • Sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif; background: #08090c; color: #fff; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(110deg, rgba(8,9,12,.96), rgba(8,9,12,.58)),
          url("/media/udk-race-hero.webp") center / cover no-repeat;
      }
      main {
        width: min(620px, 100%);
        border: 1px solid rgba(0,217,255,.35);
        border-radius: 14px;
        padding: clamp(28px, 7vw, 58px);
        background: rgba(10,12,15,.92);
      }
      img { width: 180px; height: auto; margin-bottom: 38px; }
      h1 {
        margin: 0 0 14px;
        font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
        font-size: clamp(54px, 13vw, 96px);
        font-style: italic;
        font-weight: 900;
        line-height: .78;
        letter-spacing: -.065em;
        text-transform: uppercase;
      }
      p { max-width: 500px; color: #c3cad0; line-height: 1.7; }
      button {
        min-height: 48px;
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        padding: 0 20px;
        background: #00d9ff;
        color: #08090c;
        font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: .05em;
        text-transform: uppercase;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/udk-logo-negativa.png" alt="Ultras do Kart" />
      <h1>Bandeira amarela</h1>
      <p>
        O conteúdo salvo continua disponível quando possível. A área autenticada e novas operações
        exigem conexão para proteger os dados da plataforma.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
