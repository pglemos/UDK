<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#08090c" />
    <title>UDK • Sem conexão</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,700;0,900;1,900&family=Roboto:wght@400;700&display=swap");
      :root { color-scheme: dark; font-family: "Roboto", Arial, sans-serif; background: #08090c; color: #fff; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(110deg, rgba(8,9,12,.96), rgba(8,9,12,.58)),
          url("/media/udk-race-hero.webp") center / cover no-repeat;
      }
      main {
        width: min(620px, 100%);
        border: 1px solid rgba(0,217,255,.35);
        border-radius: 14px;
        padding: clamp(28px, 7vw, 58px);
        background: rgba(10,12,15,.92);
        box-shadow: 0 26px 80px rgba(0,0,0,.45);
        backdrop-filter: blur(16px);
      }
      img { width: 180px; height: auto; margin-bottom: 38px; }
      span { color: #00d9ff; font-size: 12px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
      h1 {
        margin: 14px 0;
        font-family: "Roboto Condensed", Arial, sans-serif;
        font-size: clamp(54px, 13vw, 96px);
        font-style: italic;
        font-weight: 900;
        line-height: .78;
        letter-spacing: -.065em;
        text-transform: uppercase;
      }
      p { max-width: 500px; color: #c3cad0; line-height: 1.7; }
      button {
        min-height: 48px;
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        padding: 0 20px;
        background: #00d9ff;
        color: #08090c;
        font-family: "Roboto Condensed", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: .05em;
        text-transform: uppercase;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/udk-logo-negativa.png" alt="Ultras do Kart" />
      <span>Conexão interrompida</span>
      <h1>Bandeira amarela</h1>
      <p>
        O conteúdo salvo continua disponível quando possível. A área autenticada e novas operações
        exigem conexão para proteger os dados da plataforma.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
