<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1c191f" />
    <title>UDK • Sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #1c191f; color: #f7f5f0; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(560px, 100%); border: 1px solid #4b4750; border-radius: 20px; padding: 36px; background: #26222a; }
      img { width: 140px; margin-bottom: 28px; }
      span { color: #00d9ff; font-size: 12px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(42px, 10vw, 72px); line-height: .88; text-transform: uppercase; letter-spacing: -.06em; }
      p { color: #c5c0c9; line-height: 1.6; }
      button { margin-top: 16px; padding: 14px 18px; border: 0; border-radius: 10px; background: #00d9ff; color: #1c191f; font-weight: 900; text-transform: uppercase; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/udk.svg" alt="UDK" />
      <span>Operação offline protegida</span>
      <h1>Sem conexão</h1>
      <p>Os dados autenticados não são armazenados no cache do navegador. Operações de pista permitidas permanecem criptografadas no dispositivo e serão sincronizadas quando a conexão voltar.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
