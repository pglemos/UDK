<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@850&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#0b1618}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1440px">
  <div class="r-header region chrome" data-region="header"><!-- Dark navigation strip --></div>
  <div class="r-brand region chrome" data-region="brand"><!-- Official white UDK wordmark --></div>
  <div class="r-navigation region control" data-region="navigation"><!-- Calendar classification results pilots news and login links: rebuild the control's chrome from the crop (comp-spec.mjs --crop navigation); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-signup-header region control" data-region="signup-header"><!-- Cyan registration button: rebuild the control's chrome from the crop (comp-spec.mjs --crop signup-header); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-lead region text" data-region="lead"><!-- Two-line ULTRAS DO KART heading, white then cyan --><p style="font-size:var(--r-lead-font);font-family:var(--r-lead-family),sans-serif;font-weight:var(--r-lead-weight);line-height:1.05;margin:0">lead</p></div>
  <div class="r-intro region text" data-region="intro"><!-- Campeonato 2026 no Kartódromo de Betim. --><p style="font-size:var(--r-intro-font);line-height:1.05;margin:0">intro</p></div>
  <div class="r-signup region control" data-region="signup"><!-- Cyan Inscreva-se action: rebuild the control's chrome from the crop (comp-spec.mjs --crop signup); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-results region control" data-region="results"><!-- Outlined Ver resultados action: rebuild the control's chrome from the crop (comp-spec.mjs --crop results); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-location region text" data-region="location"><!-- Temporada 2026 and Betim MG --><p style="font-size:var(--r-location-font);line-height:1.05;margin:0">location</p></div>
  <figure class="r-race-photo region plate" data-region="race-photo"><img src="../../../apps/plataforma/public/media/official/home/race-original.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-ticket region chrome" data-region="ticket"><!-- Flat cyan upcoming race ticket --></div>
  <div class="r-next-label region text" data-region="next-label"><!-- Próxima etapa --><p style="font-size:var(--r-next-label-font);line-height:1.05;margin:0">next-label</p></div>
  <div class="r-date region text" data-region="date"><!-- 13 OUT race date --><p style="font-size:var(--r-date-font);line-height:1.05;margin:0">date</p></div>
  <div class="r-stage region text" data-region="stage"><!-- 21h Etapa regular and Traçado 05 normal e invertido --><p style="font-size:var(--r-stage-font);line-height:1.05;margin:0">stage</p></div>
  <div class="r-participate region control" data-region="participate"><!-- Outlined Participar action: rebuild the control's chrome from the crop (comp-spec.mjs --crop participate); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-categories region text" data-region="categories"><!-- Ultras Insanos and Ultras Rápidos --><p style="font-size:var(--r-categories-font);line-height:1.05;margin:0">categories</p></div>
  <div class="r-calendar-link region control" data-region="calendar-link"><!-- Ver calendário link: rebuild the control's chrome from the crop (comp-spec.mjs --crop calendar-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-ranking-title region text" data-region="ranking-title"><!-- Classificação section heading --><p style="font-size:var(--r-ranking-title-font);line-height:1.05;margin:0">ranking-title</p></div>
  <div class="r-ranking-link region control" data-region="ranking-link"><!-- Ver completa classification link: rebuild the control's chrome from the crop (comp-spec.mjs --crop ranking-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-dates-title region text" data-region="dates-title"><!-- Próximas etapas section heading --><p style="font-size:var(--r-dates-title-font);line-height:1.05;margin:0">dates-title</p></div>
  <div class="r-dates-link region control" data-region="dates-link"><!-- Calendário link: rebuild the control's chrome from the crop (comp-spec.mjs --crop dates-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-ranking-row region control" data-region="ranking-row"><!-- Rank 01 André Felisberto Ultras Insanos and 247 points: rebuild the control's chrome from the crop (comp-spec.mjs --crop ranking-row); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-future-stage region control" data-region="future-stage"><!-- 10 NOV Etapa regular track and time: rebuild the control's chrome from the crop (comp-spec.mjs --crop future-stage); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
